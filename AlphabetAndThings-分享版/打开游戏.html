<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>AlphabetAndThings｜字母、数字和好朋友</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
  <style>:root {
  --ink: #29435c;
  --blue: #356fe5;
  --blue-dark: #2458bf;
  --yellow: #ffd95c;
  --cream: #fff9e9;
  --green: #7ccb70;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: "Arial Rounded MT Bold", "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
}

button { font: inherit; }

.thing-picture {
  display: inline-block;
  flex: 0 0 auto;
  background-position: var(--atlas-x) var(--atlas-y);
  background-repeat: no-repeat;
  background-size: 600% 400%;
  border-radius: 22%;
}

.home-shell {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  background:
    radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.92) 0 3px, transparent 4px),
    radial-gradient(circle at 87% 28%, rgba(255, 255, 255, 0.8) 0 4px, transparent 5px),
    linear-gradient(180deg, #dff5ff 0%, #effbff 58%, #fff8df 100%);
}

.home-header {
  position: relative;
  z-index: 5;
  display: flex;
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 28px 0;
  align-items: center;
  justify-content: space-between;
}

.brand-mark {
  display: block;
  width: 104px;
  height: 76px;
}

.brand-excavator {
  display: block;
  width: 100%;
  height: 100%;
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
  filter: drop-shadow(0 8px 10px rgba(65, 98, 123, 0.2));
}

.grown-up-button {
  display: flex;
  min-height: 52px;
  align-items: center;
  gap: 9px;
  padding: 0 19px;
  border: 2px solid rgba(53, 111, 229, 0.15);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  color: #557086;
  cursor: pointer;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 5px 14px rgba(64, 111, 143, 0.08);
  touch-action: none;
  user-select: none;
}

.parent-gate-wrap {
  position: relative;
}

.gate-message {
  position: absolute;
  top: calc(100% + 9px);
  right: 0;
  width: max-content;
  padding: 7px 11px;
  border-radius: 10px;
  background: rgba(41, 67, 92, 0.9);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}

.hero {
  position: relative;
  z-index: 2;
  display: grid;
  width: min(1120px, calc(100% - 48px));
  min-height: calc(100svh - 124px);
  margin: 0 auto;
  grid-template-columns: 0.88fr 1.12fr;
  align-items: center;
  gap: 44px;
  padding-bottom: 64px;
}

.hero-copy {
  position: relative;
  z-index: 3;
  padding-bottom: 30px;
}

.eyebrow {
  display: inline-flex;
  margin: 0 0 14px;
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  color: #49728d;
  font-size: clamp(14px, 1.5vw, 17px);
  font-weight: 800;
  letter-spacing: 0.08em;
}

h1 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(46px, 6vw, 76px);
  font-weight: 900;
  letter-spacing: -0.06em;
  line-height: 1.08;
}

h1 > span {
  display: block;
  text-shadow: 0 4px 0 #fff;
}

h1 small {
  display: block;
  margin-top: 10px;
  color: var(--blue);
  font-size: clamp(21px, 2.5vw, 31px);
  letter-spacing: 0.02em;
}

.welcome-copy {
  margin: 23px 0 27px;
  color: #577187;
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 700;
  line-height: 1.65;
}

.start-button {
  display: inline-flex;
  min-width: 274px;
  min-height: 88px;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 10px 27px;
  border: 4px solid #fff;
  border-radius: 28px;
  background: linear-gradient(180deg, #4d8aff, var(--blue));
  color: #fff;
  cursor: pointer;
  font-size: 27px;
  font-weight: 900;
  box-shadow: 0 9px 0 var(--blue-dark), 0 16px 28px rgba(40, 90, 174, 0.28);
  transition: transform 150ms ease, box-shadow 150ms ease;
}

.start-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 11px 0 var(--blue-dark), 0 19px 30px rgba(40, 90, 174, 0.25);
}

.start-button:active {
  transform: translateY(6px);
  box-shadow: 0 3px 0 var(--blue-dark), 0 9px 18px rgba(40, 90, 174, 0.2);
}

.play-icon {
  display: grid;
  width: 51px;
  height: 51px;
  place-items: center;
  padding-left: 4px;
  border-radius: 50%;
  background: var(--yellow);
  color: #d58a24;
  font-size: 22px;
  box-shadow: inset 0 -4px 0 rgba(214, 142, 33, 0.28);
}

.start-button small {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  letter-spacing: 0.18em;
  opacity: 0.82;
}

.start-button.compact {
  min-width: 210px;
  min-height: 70px;
  border-radius: 23px;
  font-size: 22px;
}

.session-note {
  display: flex;
  margin-top: 21px;
  align-items: center;
  gap: 8px;
  color: #6e8496;
  font-size: 14px;
  font-weight: 700;
}

.friends-stage {
  position: relative;
  min-height: 530px;
}

.rainbow {
  position: absolute;
  top: 44px;
  right: 5%;
  width: 78%;
  height: 360px;
  overflow: hidden;
  border: 25px solid #ff8e95;
  border-bottom: 0;
  border-radius: 300px 300px 0 0;
  opacity: 0.92;
}

.rainbow::before,
.rainbow::after,
.rainbow span {
  position: absolute;
  border-radius: 260px 260px 0 0;
  content: "";
}

.rainbow::before {
  inset: 0;
  border: 24px solid #ffd55f;
  border-bottom: 0;
}

.rainbow::after {
  inset: 24px;
  border: 24px solid #63cf96;
  border-bottom: 0;
}

.rainbow span {
  inset: 48px;
  height: 250px;
  border: 24px solid #6ba6f1;
  border-bottom: 0;
  background: #eaf8ff;
}

.friend {
  position: absolute;
  z-index: 3;
  display: flex;
  width: 184px;
  height: 207px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 5px solid #fff;
  border-radius: 46% 54% 48% 52% / 54% 48% 52% 46%;
  box-shadow: 0 16px 30px rgba(53, 91, 120, 0.2), inset 0 -10px 0 rgba(0, 0, 0, 0.07);
}

.friend-letter {
  color: #fff;
  font-size: 88px;
  font-weight: 900;
  line-height: 0.88;
  text-shadow: 0 5px 0 rgba(35, 68, 92, 0.2);
}

.friend-thing {
  width: 66px;
  height: 66px;
  margin-top: 8px;
  border: 3px solid rgba(255,255,255,.74);
  box-shadow: 0 4px 8px rgba(44, 79, 104, 0.16);
}

.friend-apple { top: 30px; left: 7%; transform: rotate(-7deg); background: #f06376; }
.friend-ball { top: 182px; right: 2%; transform: rotate(7deg); background: #f5b84b; }
.friend-cat { bottom: 15px; left: 28%; transform: rotate(-2deg); background: #688ee9; }

.ground {
  position: absolute;
  right: -12vw;
  bottom: -110px;
  left: -8vw;
  height: 175px;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(180deg, #9edb78, var(--green));
  box-shadow: inset 0 11px 0 rgba(255, 255, 255, 0.18);
}

.flower {
  position: absolute;
  top: 16px;
  color: #fff;
  font-size: 29px;
  text-shadow: 0 3px 0 rgba(73, 144, 61, 0.24);
}

.flower-one { left: 19%; color: #fff6a0; }
.flower-two { left: 53%; top: 38px; color: #f6b1c5; }
.flower-three { right: 12%; color: #fff; }

.sun-glow {
  position: absolute;
  top: -90px;
  left: -70px;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(255, 225, 105, 0.45);
  box-shadow: 0 0 90px rgba(255, 223, 94, 0.34);
}

.cloud {
  position: absolute;
  z-index: 1;
  width: 130px;
  height: 39px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
}

.cloud::before,
.cloud::after {
  position: absolute;
  bottom: 0;
  border-radius: 50%;
  background: inherit;
  content: "";
}

.cloud::before { left: 23px; width: 57px; height: 57px; }
.cloud::after { right: 20px; width: 45px; height: 45px; }
.cloud-one { top: 160px; left: 46%; transform: scale(0.8); }
.cloud-two { top: 95px; right: 4%; transform: scale(0.66); }

button:focus-visible {
  outline: 5px solid rgba(255, 199, 58, 0.75);
  outline-offset: 5px;
}

.soft-button,
.danger-soft-button {
  min-height: 54px;
  padding: 0 22px;
  border: 2px solid rgba(53, 111, 229, 0.18);
  border-radius: 17px;
  background: #fff;
  color: #3d6687;
  cursor: pointer;
  font-weight: 800;
  box-shadow: 0 5px 0 rgba(75, 108, 133, 0.1);
}

.danger-soft-button {
  border-color: rgba(210, 79, 87, 0.22);
  color: #bd4d55;
}

/* Game */
.game-shell {
  min-height: 100svh;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 13%, rgba(255,255,255,.82) 0 4px, transparent 5px),
    radial-gradient(circle at 83% 19%, rgba(255,255,255,.78) 0 4px, transparent 5px),
    linear-gradient(180deg, #dff5ff 0%, #f4fbff 62%, #fff7df 100%);
}

.game-header {
  display: grid;
  width: min(1040px, calc(100% - 34px));
  margin: 0 auto;
  padding: 22px 0;
  grid-template-columns: 64px 1fr 64px;
  align-items: center;
  gap: 20px;
}

.round-icon-button {
  display: grid;
  width: 60px;
  height: 60px;
  place-items: center;
  border: 4px solid #fff;
  border-radius: 21px;
  background: #6fa6e8;
  color: #fff;
  cursor: pointer;
  font-family: Arial, sans-serif;
  font-size: 31px;
  font-weight: 900;
  box-shadow: 0 6px 0 #4f82c3, 0 10px 20px rgba(58, 96, 134, .14);
}

.speaker-button {
  background: #f3b94a;
  box-shadow: 0 6px 0 #d6962e, 0 10px 20px rgba(138, 100, 31, .13);
  font-size: 26px;
}

.round-progress {
  display: flex;
  min-height: 43px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 0 22px;
  border: 3px solid rgba(255,255,255,.84);
  border-radius: 999px;
  background: rgba(255,255,255,.58);
}

.progress-dot {
  width: 18px;
  height: 18px;
  border: 3px solid #a9c8dc;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s ease, background .2s ease;
}

.progress-dot.active {
  transform: scale(1.18);
  border-color: #e1a02f;
  background: #ffd55a;
  box-shadow: 0 0 0 4px rgba(255, 213, 90, .2);
}

.question-area {
  display: flex;
  width: min(1050px, calc(100% - 40px));
  min-height: calc(100svh - 108px);
  margin: 0 auto;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 42px;
}

.learning-focus {
  display: grid;
  width: min(510px, 100%);
  place-items: center;
  gap: 12px;
  padding: 18px 28px 22px;
  border: 6px solid #fff;
  border-radius: 42px;
  background: rgba(255,253,244,.94);
  box-shadow: 0 16px 38px rgba(55, 97, 128, .18);
}

.learning-focus.number-focus {
  min-height: 370px;
}

.number-dot-board {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 13px;
}

.focus-number-dots {
  width: min(390px, 86vw);
  min-height: 310px;
  padding: 22px;
  border: 5px solid #fff;
  border-radius: 36px;
  background: linear-gradient(150deg, #fffdf5, #edf8ff);
  box-shadow: 0 10px 26px rgba(55, 83, 104, .17);
}

.number-dot-row {
  display: flex;
  min-height: 45px;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.number-dot-row i {
  display: block;
  width: clamp(32px, 5.2vw, 45px);
  height: clamp(32px, 5.2vw, 45px);
  border: 4px solid #fff;
  border-radius: 50%;
  background: #ef6475;
  box-shadow: inset 0 -5px 0 rgba(118, 37, 51, .13), 0 4px 8px rgba(76, 91, 103, .15);
}

.number-dot-row:nth-child(2n) i { background: #f4b94f; }
.number-dot-row:nth-child(3n) i { background: #69b97a; }
.number-dot-row:nth-child(4n) i { background: #5d98e2; }

.empty-dot-note {
  display: grid;
  width: 210px;
  height: 210px;
  place-items: center;
  border: 7px dashed #a8c6d9;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(168, 198, 217, .15), transparent 66%);
}

.focus-picture {
  width: clamp(238px, 31vh, 324px);
  height: clamp(238px, 31vh, 324px);
  border: 5px solid #fff;
  border-radius: 30%;
  box-shadow: 0 10px 26px rgba(55, 83, 104, .2);
}

.focus-caption {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  color: #395d79;
}

.focus-caption strong {
  display: grid;
  width: 66px;
  height: 66px;
  place-items: center;
  border-radius: 21px;
  background: #ef6475;
  color: #fff;
  font-size: 45px;
  line-height: 1;
  text-shadow: 0 3px 0 rgba(110, 39, 55, .16);
  box-shadow: inset 0 -6px 0 rgba(112, 42, 53, .13);
}

.focus-word {
  display: flex;
  align-items: center;
  gap: 0;
}

.focus-word b {
  font-size: clamp(27px, 3.2vw, 39px);
  font-weight: 900;
}

.focus-caption small {
  color: #667f92;
  font-size: clamp(18px, 2vw, 23px);
  font-weight: 900;
}

.choice-grid {
  display: grid;
  width: min(760px, 100%);
  place-items: center;
  align-content: center;
  justify-content: center;
  gap: clamp(24px, 4vw, 46px);
  padding: 25px 0 12px;
}

.choice-grid.choices-2 { grid-template-columns: repeat(2, minmax(180px, 250px)); }
.choice-grid.choices-3 { grid-template-columns: repeat(3, minmax(150px, 205px)); }

.letter-choice {
  display: flex;
  width: 100%;
  min-height: 142px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 8px solid #fff;
  border-radius: 36px;
  background: linear-gradient(155deg, #71a8f0, #4d83d9);
  color: #fff;
  cursor: pointer;
  font-size: clamp(74px, 9vw, 108px);
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 8px 0 rgba(35, 66, 111, .2);
  box-shadow: 0 13px 0 #3768aa, 0 21px 34px rgba(43, 79, 113, .2);
  transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
  touch-action: manipulation;
  user-select: none;
}

.letter-choice > span { line-height: .88; }

.letter-choice.number-choice > span {
  font-size: clamp(65px, 8.5vw, 100px);
}

.letter-choice > small {
  margin-top: 15px;
  padding: 6px 13px;
  border-radius: 999px;
  background: rgba(255,255,255,.2);
  font-size: clamp(13px, 1.6vw, 17px);
  letter-spacing: .04em;
  text-shadow: none;
}

.letter-choice:nth-child(2) {
  background: linear-gradient(155deg, #78c982, #4caa60);
  box-shadow: 0 13px 0 #378747, 0 21px 34px rgba(46, 111, 58, .18);
}

.letter-choice:nth-child(3) {
  background: linear-gradient(155deg, #f4c85e, #e7a83d);
  box-shadow: 0 13px 0 #bd7e2d, 0 21px 34px rgba(116, 78, 35, .18);
}

.letter-choice:hover:not(:disabled) { transform: translateY(-5px) rotate(-1deg); }
.letter-choice:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 5px 0 #3768aa; }
.letter-choice:nth-child(2):active:not(:disabled) { box-shadow: 0 5px 0 #378747; }
.letter-choice:nth-child(3):active:not(:disabled) { box-shadow: 0 5px 0 #bd7e2d; }
.letter-choice:disabled { cursor: default; }
.letter-choice.wrong-choice { animation: gentle-shake .42s ease; filter: saturate(.78); }
.letter-choice.correct-choice { transform: scale(1.05); filter: brightness(1.08); }
.letter-choice.hinted { box-shadow: 0 13px 0 #3768aa, 0 0 0 10px rgba(255, 213, 90, .52), 0 21px 34px rgba(43, 79, 113, .2); }
.letter-choice.assisted { animation: helpful-glow .8s ease-in-out infinite alternate; }

.feedback-message {
  min-height: 35px;
  color: #607a90;
  font-size: 19px;
  font-weight: 900;
}

.reward-overlay {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  border: 0;
  background: rgba(223, 245, 255, .68);
  backdrop-filter: blur(6px);
  color: inherit;
  cursor: pointer;
  font: inherit;
  text-align: inherit;
}

.wrong-feedback-overlay {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 20px;
  border: 0;
  background: rgba(255, 249, 246, .16);
  color: #c94d5d;
  cursor: pointer;
  font: inherit;
}

.wrong-mark {
  display: grid;
  width: clamp(112px, 18vw, 154px);
  height: clamp(112px, 18vw, 154px);
  place-items: center;
  border: 7px solid #f19aa4;
  border-radius: 50%;
  background: rgba(255, 247, 247, .97);
  color: #df5b6b;
  font-family: Arial, sans-serif;
  font-size: clamp(88px, 14vw, 122px);
  font-weight: 700;
  line-height: .76;
  box-shadow: 0 13px 30px rgba(133, 61, 71, .16);
  text-shadow: 0 3px 0 #fff;
  animation: gentle-cross-shake .5s ease both;
}

.wrong-overlay-copy {
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,.92);
  font-size: clamp(17px, 2.3vw, 22px);
  font-weight: 900;
  box-shadow: 0 6px 18px rgba(89, 65, 70, .1);
}

.reward-card {
  position: relative;
  display: grid;
  width: min(520px, 100%);
  min-height: 380px;
  place-items: center;
  padding: 28px;
  overflow: hidden;
  border: 9px solid #ef6475;
  border-radius: 48px;
  background: #fffdf4;
  box-shadow: 0 24px 60px rgba(37, 75, 104, .24);
  animation: reward-pop .36s cubic-bezier(.2, 1.4, .5, 1);
}

.reward-card::before {
  position: absolute;
  inset: -60px;
  z-index: -1;
  background: conic-gradient(from 0deg, #fff5b6, #fff, #dff5ff, #fff, #fff5b6);
  content: "";
  animation: slow-spin 8s linear infinite;
}

.reward-stars {
  color: #f2b93e;
  font-size: 34px;
  letter-spacing: 16px;
}

.reward-picture {
  width: 148px;
  height: 148px;
  border: 5px solid #fff;
  box-shadow: 0 9px 18px rgba(56, 79, 93, .18);
}

.reward-number-dots {
  width: 250px;
  min-height: 150px;
  gap: 6px;
}

.reward-number-dots .number-dot-row {
  min-height: 24px;
  gap: 8px;
}

.reward-number-dots .number-dot-row i {
  width: 23px;
  height: 23px;
  border-width: 2px;
  box-shadow: inset 0 -3px 0 rgba(118, 37, 51, .13), 0 2px 4px rgba(76, 91, 103, .13);
}

.reward-number-dots .empty-dot-note {
  width: 125px;
  height: 125px;
  border-width: 5px;
  font-size: 20px;
}

.reward-word {
  display: flex;
  align-items: baseline;
  gap: 10px;
  color: #304e68;
}

.reward-english { font-size: 31px; font-weight: 900; }
.reward-word strong { color: #e9566b; font-size: 49px; }
.reward-word small { color: #687f91; font-size: 21px; font-weight: 800; }
.reward-number-answer .reward-english { font-size: 25px; }
.reward-number-answer .reward-english strong { margin-right: 5px; font-size: 54px; }
.reward-card > p { margin: 4px 0 0; color: #47769d; font-size: 24px; font-weight: 900; }
.reward-card > .skip-hint { color: #7890a2; font-size: 14px; font-weight: 800; }

/* Completion */
.celebration-shell {
  display: grid;
  min-height: 100svh;
  place-items: center;
  padding: 32px;
  background:
    radial-gradient(circle at 12% 12%, #fff2a8 0 5px, transparent 6px),
    radial-gradient(circle at 87% 20%, #ef8799 0 6px, transparent 7px),
    radial-gradient(circle at 80% 78%, #76b5ec 0 5px, transparent 6px),
    linear-gradient(160deg, #dff6ff, #fff8d9);
}

.celebration-card {
  width: min(650px, 100%);
  padding: clamp(32px, 6vw, 56px);
  border: 7px solid #fff;
  border-radius: 48px;
  background: rgba(255,255,255,.84);
  text-align: center;
  box-shadow: 0 22px 60px rgba(54, 91, 120, .18);
}

.celebration-stars { color: #e9af35; font-size: 32px; letter-spacing: 15px; }
.trophy { margin: 8px 0; font-family: "Noto Color Emoji", sans-serif; font-size: 105px; }
.celebration-card h1 { color: #355f8c; font-size: clamp(45px, 7vw, 67px); }
.celebration-copy { margin: 19px auto 29px; color: #60798e; font-size: 19px; font-weight: 700; line-height: 1.65; }
.celebration-actions { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }

/* Parent area */
.parent-shell {
  min-height: 100svh;
  padding: 36px max(24px, calc((100vw - 1120px) / 2)) 70px;
  background: #f4f8fb;
}

.parent-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 28px;
}

.parent-header h1 {
  color: #294c68;
  font-size: clamp(38px, 5vw, 56px);
  letter-spacing: -.04em;
}

.parent-header .eyebrow { margin-bottom: 8px; background: #e4f1f8; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.summary-grid article,
.parent-panel {
  border: 1px solid #dbe7ee;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 8px 24px rgba(57, 83, 102, .06);
}

.summary-grid article { padding: 22px; }
.summary-grid span { color: #708596; font-size: 13px; font-weight: 800; }
.summary-grid strong { display: block; margin: 5px 0; color: #365f80; font-size: 39px; line-height: 1.1; }
.summary-grid strong small { margin-left: 2px; color: #91a3b1; font-size: 18px; }
.summary-grid .duration-number { font-size: 27px; }
.summary-grid p { margin: 0; color: #8496a4; font-size: 13px; }

.parent-panel {
  margin-top: 20px;
  padding: 26px;
}

.parent-panel h2 { margin: 0 0 6px; color: #345b79; font-size: 23px; }
.parent-panel p { margin: 0; color: #718697; font-size: 14px; line-height: 1.55; }

.settings-panel,
.privacy-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}

.volume-control {
  display: flex;
  min-width: min(380px, 46vw);
  align-items: center;
  gap: 13px;
  font-family: "Noto Color Emoji", sans-serif;
}

.sound-control-stack {
  display: grid;
  gap: 12px;
}

.volume-control > strong {
  min-width: 38px;
  color: #4f6d83;
  font-family: "Arial Rounded MT Bold", "PingFang SC", sans-serif;
  font-size: 13px;
}

.volume-control input { width: 100%; accent-color: #4d83d9; }

.panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }

.letter-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}

.letter-stat {
  display: grid;
  min-height: 82px;
  grid-template-columns: 58px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 11px;
  border: 1px solid #e3ebf0;
  border-radius: 18px;
  background: #fbfdfe;
}

.stat-letter {
  display: grid;
  width: 58px;
  height: 58px;
  place-items: center;
  border-radius: 16px;
  color: #fff;
  font-size: 32px;
  font-weight: 900;
  text-shadow: 0 2px 0 rgba(50, 67, 80, .18);
}

.letter-stat strong { color: #42637c; font-size: 15px; }
.letter-stat p { margin-top: 3px; font-size: 12px; }
.letter-stat small { color: #91a0aa; font-size: 11px; }
.stat-picture {
  width: 52px;
  height: 52px;
  margin-right: 4px;
  border: 2px solid #fff;
  box-shadow: 0 3px 8px rgba(46, 74, 93, .12);
}

.number-stat {
  grid-template-columns: 58px 1fr;
}

.reset-confirm { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; color: #a14b51; font-size: 14px; font-weight: 800; }
.reset-confirm button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #f3e8e9; color: #9f454d; cursor: pointer; font-weight: 800; }
.reset-confirm button:last-child { background: #eef3f6; color: #5e7484; }

@keyframes gentle-shake {
  0%, 100% { transform: translateX(0); }
  30% { transform: translateX(-8px); }
  70% { transform: translateX(8px); }
}

@keyframes gentle-cross-shake {
  0% { opacity: 0; transform: scale(.72); }
  35% { opacity: 1; transform: scale(1.04) rotate(-4deg); }
  55% { transform: scale(1) rotate(4deg); }
  74% { transform: rotate(-2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes helpful-glow {
  from { transform: scale(1); filter: brightness(1); }
  to { transform: scale(1.04); filter: brightness(1.13); }
}

@keyframes reward-pop {
  from { transform: scale(.75); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes slow-spin { to { transform: rotate(360deg); } }

@media (max-width: 800px) {
  .home-header { padding-top: 18px; }

  .hero {
    grid-template-columns: 1fr;
    gap: 8px;
    padding-top: 18px;
    text-align: center;
  }

  .hero-copy {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .friends-stage {
    min-height: 370px;
    transform: scale(0.78);
    transform-origin: top center;
  }

  .rainbow { right: 8%; width: 84%; height: 280px; }
  .friend { width: 150px; height: 170px; }
  .friend-letter { font-size: 67px; }
  .friend-thing { width: 54px; height: 54px; }

  .choice-grid.choices-3 {
    grid-template-columns: repeat(3, minmax(140px, 205px));
  }

  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .letter-stats-grid { grid-template-columns: 1fr; }
  .settings-panel,
  .privacy-panel { align-items: stretch; flex-direction: column; }
  .volume-control { min-width: 100%; }
}

@media (max-width: 480px) {
  .home-header,
  .hero { width: min(100% - 28px, 1120px); }

  .brand-mark { width: 68px; height: 57px; }
  .brand-a { font-size: 38px; }
  .brand-apple { font-size: 25px; }

  .grown-up-button {
    min-height: 48px;
    padding: 0 14px;
    font-size: 13px;
  }

  .welcome-copy { margin: 17px 0 21px; }

  .start-button {
    min-width: 250px;
    min-height: 80px;
    font-size: 24px;
  }

  .game-header {
    grid-template-columns: 52px 1fr 52px;
    gap: 10px;
    padding-top: 14px;
  }

  .round-icon-button { width: 50px; height: 50px; border-width: 3px; border-radius: 17px; font-size: 25px; }
  .speaker-button { font-size: 21px; }
  .round-progress { gap: 8px; padding: 0 10px; }
  .progress-dot { width: 14px; height: 14px; border-width: 2px; }

  .question-area { width: calc(100% - 24px); padding-top: 4px; }
  .learning-focus { width: min(390px, 100%); gap: 8px; padding: 12px 14px 15px; border-width: 4px; border-radius: 30px; }
  .learning-focus.number-focus { min-height: 320px; }
  .focus-number-dots { min-height: 270px; padding: 14px 10px; }
  .number-dot-row { min-height: 38px; gap: 11px; }
  .number-dot-row i { width: clamp(29px, 8vw, 38px); height: clamp(29px, 8vw, 38px); border-width: 3px; }
  .empty-dot-note { width: 180px; height: 180px; font-size: 23px; }
  .focus-picture { width: clamp(188px, 33vh, 250px); height: clamp(188px, 33vh, 250px); border-width: 4px; }
  .focus-caption { gap: 8px; }
  .focus-caption strong { width: 54px; height: 54px; border-radius: 17px; font-size: 38px; }
  .focus-word b { font-size: 26px; }
  .focus-caption small { font-size: 17px; }

  .choice-grid,
  .choice-grid.choices-2,
  .choice-grid.choices-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    padding-top: 25px;
  }

  .choice-grid.choices-3 .letter-choice:last-child { grid-column: 1 / -1; width: 48%; }
  .letter-choice { min-height: 126px; border-width: 6px; border-radius: 30px; font-size: 76px; box-shadow: 0 9px 0 #3768aa, 0 15px 24px rgba(43,79,113,.17); }
  .letter-choice > small { margin-top: 10px; padding: 4px 9px; font-size: 11px; }

  .reward-card { min-height: 350px; border-width: 7px; border-radius: 38px; }
  .reward-picture { width: 126px; height: 126px; }
  .reward-word { flex-wrap: wrap; justify-content: center; }

  .celebration-shell { padding: 18px; }
  .celebration-card { padding: 29px 20px; border-radius: 36px; }

  .parent-shell { padding: 24px 14px 50px; }
  .summary-grid { gap: 10px; }
  .summary-grid article { padding: 17px 14px; }
  .summary-grid strong { font-size: 32px; }
  .parent-panel { padding: 18px; border-radius: 20px; }
  .letter-stat { grid-template-columns: 52px 1fr; }
  .stat-letter { width: 52px; height: 52px; }
  .stat-picture { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* Difficulty selection */
.difficulty-picker {
  display: grid;
  width: min(560px, 100%);
  margin: -6px 0 24px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.difficulty-option {
  display: grid;
  min-height: 62px;
  align-content: center;
  padding: 9px 13px;
  border: 3px solid rgba(255, 255, 255, .9);
  border-radius: 18px;
  background: rgba(255, 255, 255, .62);
  color: #547187;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 4px 0 rgba(68, 101, 128, .1);
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}

.difficulty-option:hover { transform: translateY(-2px); }
.difficulty-option strong { color: #355f83; font-size: 17px; }
.difficulty-option span { margin-top: 2px; font-size: 12px; font-weight: 800; }
.difficulty-option.selected {
  border-color: #ffd45d;
  background: #fff9dc;
  box-shadow: 0 5px 0 #e7b83e, 0 0 0 4px rgba(255, 216, 93, .18);
}

.hard-status {
  margin-top: 5px;
  color: #ae6570;
  font-size: 12px;
  font-weight: 900;
  text-align: center;
}

/* Picture-only and audio-only clue states */
.picture-only-focus { padding-bottom: 18px; }
.audio-only-focus {
  width: min(430px, 100%);
  min-height: clamp(245px, 32vh, 330px);
  background: rgba(249, 253, 255, .96);
}

.listen-again-card {
  display: grid;
  width: clamp(190px, 26vh, 255px);
  height: clamp(190px, 26vh, 255px);
  place-items: center;
  align-content: center;
  gap: 14px;
  border: 7px solid #fff;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 28%, #aee1ff, #67a9eb 62%, #4d83d9);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 13px 0 #3f73b8, 0 21px 40px rgba(61, 105, 147, .2), 0 0 0 14px rgba(126, 193, 239, .16);
  animation: listening-pulse 1.8s ease-in-out infinite;
}

.listen-again-card > span { font-family: "Noto Color Emoji", sans-serif; font-size: clamp(70px, 10vh, 105px); }
.listen-again-card small { font-size: 15px; font-weight: 900; text-shadow: 0 2px 0 rgba(31, 74, 114, .18); }

.question-failed-overlay { background: rgba(255, 249, 246, .5); }
.question-failed-overlay > small { color: #8c7480; font-size: 13px; font-weight: 800; }
.soft-cross { border-color: #efadb4; color: #d96a77; transform: scale(.88); }

.gentle-failure-shell { background: linear-gradient(160deg, #e9f7ff, #fff8dd); }
.gentle-failure-card { border-color: #d9efd2; }

/* Parent settings and local word extension */
.difficulty-parent-panel,
.extension-heading,
.extension-preview,
.upload-step {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.hard-limit-control {
  display: grid;
  min-width: min(390px, 46vw);
  grid-template-columns: auto 1fr 58px;
  align-items: center;
  gap: 13px;
  color: #536f84;
  font-size: 14px;
  font-weight: 800;
}

.hard-limit-control input { width: 100%; accent-color: #d86b76; }
.hard-limit-control strong { color: #bb5965; }

.extension-heading { align-items: flex-start; }
.local-badge {
  flex: 0 0 auto;
  padding: 7px 12px;
  border-radius: 999px;
  background: #e5f5e5;
  color: #3e7f51;
  font-size: 12px;
  font-weight: 900;
}

.extension-search-row {
  display: grid;
  margin-top: 20px;
  grid-template-columns: 1fr auto;
  gap: 12px;
}

.extension-search-row > input {
  min-height: 56px;
  padding: 0 17px;
  border: 2px solid #d7e5ed;
  border-radius: 16px;
  background: #fbfdfe;
  color: #365b77;
  font-size: 17px;
  font-weight: 700;
  outline: 0;
}

.extension-search-row > input:focus { border-color: #78a9e7; box-shadow: 0 0 0 4px rgba(96, 151, 221, .13); }
.primary-soft-button { border-color: #86aee1; background: #edf5ff; color: #3d70b4; }

.extension-status {
  margin-top: 13px !important;
  padding: 10px 13px;
  border-radius: 12px;
  font-weight: 800;
}
.extension-status.info { background: #f1f6fa; color: #5e7689; }
.extension-status.success { background: #edf8ee; color: #447b50; }
.extension-status.error { background: #fff0f1; color: #a9515b; }

.upload-step,
.extension-preview {
  margin-top: 15px;
  padding: 16px;
  border: 1px solid #dce8ee;
  border-radius: 19px;
  background: #fbfdfe;
  justify-content: flex-start;
  flex-wrap: wrap;
}

.upload-step > div { display: grid; min-width: 180px; }
.upload-step > div strong { color: #3a617e; font-size: 19px; }
.upload-step > div span { color: #718697; font-weight: 800; }
.upload-step > small { color: #8194a1; font-size: 12px; }

.upload-button { position: relative; overflow: hidden; }
.upload-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload-button span {
  display: grid;
  min-height: 48px;
  place-items: center;
  padding: 0 17px;
  border: 2px solid #85aee2;
  border-radius: 14px;
  background: #edf5ff;
  color: #3b6eaf;
  cursor: pointer;
  font-weight: 900;
}

.extension-preview { display: grid; grid-template-columns: 112px 1fr auto auto auto; }
.extension-preview-picture {
  width: 106px;
  height: 106px;
  border: 4px solid #fff;
  background-color: #fffaf0;
  box-shadow: 0 5px 14px rgba(49, 77, 97, .12);
}
.extension-preview > div { display: grid; gap: 4px; }
.extension-preview > div strong { color: #345d7c; font-size: 20px; }
.extension-preview > div span { color: #688094; font-weight: 900; }
.extension-preview > div small { color: #8999a5; }
.confirm-extension-button { border-color: #83bd8f; background: #eef9f0; color: #3f7c4c; }

.safe-catalog { margin-top: 18px; color: #526f85; }
.safe-catalog summary { cursor: pointer; font-size: 14px; font-weight: 900; }
.catalog-chips { display: flex; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
.catalog-chips button {
  padding: 7px 11px;
  border: 1px solid #d6e4ec;
  border-radius: 999px;
  background: #f8fbfd;
  color: #5f788b;
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
}

.enabled-extensions { margin-top: 22px; }
.enabled-extensions h3 { margin: 0 0 10px; color: #45677e; font-size: 16px; }
.enabled-extensions article {
  display: grid;
  min-height: 62px;
  margin-top: 8px;
  grid-template-columns: 50px 1fr auto auto;
  align-items: center;
  gap: 11px;
  padding: 7px 10px;
  border: 1px solid #e1e9ee;
  border-radius: 15px;
}
.enabled-extension-picture { width: 48px; height: 48px; background-color: #fffaf0; }
.enabled-extensions article > span { display: grid; color: #42647c; }
.enabled-extensions article > span small { color: #8697a3; }
.enabled-extensions article > button { padding: 7px 10px; border: 0; border-radius: 9px; background: #edf4f8; color: #597286; cursor: pointer; font-size: 12px; font-weight: 800; }

.sentinel-note {
  display: flex;
  margin-top: 18px;
  gap: 12px;
  padding: 13px 15px;
  border-radius: 15px;
  background: #fff8df;
  color: #796932;
  font-size: 12px;
  line-height: 1.55;
}
.sentinel-note strong { flex: 0 0 auto; }

@keyframes listening-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}

@media (max-width: 980px) {
  .extension-preview { grid-template-columns: 100px 1fr; }
  .extension-preview > button { width: 100%; }
  .difficulty-parent-panel { align-items: stretch; flex-direction: column; }
  .hard-limit-control { min-width: 100%; }
}

@media (max-width: 800px) {
  .home-shell { overflow-y: auto; }
  .hero { padding-bottom: 38px; }
  .difficulty-picker { margin-right: auto; margin-left: auto; }
  .extension-heading { align-items: stretch; flex-direction: column; }
  .local-badge { align-self: flex-start; }
}

@media (max-width: 540px) {
  .difficulty-picker { grid-template-columns: 1fr 1fr; gap: 7px; }
  .difficulty-option { min-height: 57px; padding: 7px 9px; }
  .difficulty-option strong { font-size: 15px; }
  .difficulty-option span { font-size: 10px; }
  .extension-search-row { grid-template-columns: 1fr; }
  .extension-preview { grid-template-columns: 1fr; }
  .extension-preview-picture { justify-self: center; }
  .upload-step { align-items: stretch; flex-direction: column; }
  .sentinel-note { flex-direction: column; }
  .enabled-extensions article { grid-template-columns: 48px 1fr; }
  .enabled-extensions article > button { width: 100%; }
}
