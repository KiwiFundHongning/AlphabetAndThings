<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>AlphabetAndThings｜字母、数字和好朋友</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
  <style>:root {
  --ink: #29435c;
  --blue: #356fe5;
  --blue-dark: #2458bf;
  --yellow: #ffd95c;
  --cream: #fff9e9;
  --green: #7ccb70;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: "Arial Rounded MT Bold", "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
}

button { font: inherit; }

.thing-picture {
  display: inline-block;
  flex: 0 0 auto;
  background-position: var(--atlas-x) var(--atlas-y);
  background-repeat: no-repeat;
  background-size: 600% 400%;
  border-radius: 22%;
}

.home-shell {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  background:
    radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.92) 0 3px, transparent 4px),
    radial-gradient(circle at 87% 28%, rgba(255, 255, 255, 0.8) 0 4px, transparent 5px),
    linear-gradient(180deg, #dff5ff 0%, #effbff 58%, #fff8df 100%);
}

.home-header {
  position: relative;
  z-index: 5;
  display: flex;
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 28px 0;
  align-items: center;
  justify-content: space-between;
}

.brand-mark {
  display: block;
  width: 104px;
  height: 76px;
}

.brand-excavator {
  display: block;
  width: 100%;
  height: 100%;
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
  filter: drop-shadow(0 8px 10px rgba(65, 98, 123, 0.2));
}

.grown-up-button {
  display: flex;
  min-height: 52px;
  align-items: center;
  gap: 9px;
  padding: 0 19px;
  border: 2px solid rgba(53, 111, 229, 0.15);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  color: #557086;
  cursor: pointer;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 5px 14px rgba(64, 111, 143, 0.08);
  touch-action: none;
  user-select: none;
}

.parent-gate-wrap {
  position: relative;
}

.gate-message {
  position: absolute;
  top: calc(100% + 9px);
  right: 0;
  width: max-content;
  padding: 7px 11px;
  border-radius: 10px;
  background: rgba(41, 67, 92, 0.9);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}

.hero {
  position: relative;
  z-index: 2;
  display: grid;
  width: min(1120px, calc(100% - 48px));
  min-height: calc(100svh - 124px);
  margin: 0 auto;
  grid-template-columns: 0.88fr 1.12fr;
  align-items: center;
  gap: 44px;
  padding-bottom: 64px;
}

.hero-copy {
  position: relative;
  z-index: 3;
  padding-bottom: 30px;
}

.eyebrow {
  display: inline-flex;
  margin: 0 0 14px;
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  color: #49728d;
  font-size: clamp(14px, 1.5vw, 17px);
  font-weight: 800;
  letter-spacing: 0.08em;
}

h1 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(46px, 6vw, 76px);
  font-weight: 900;
  letter-spacing: -0.06em;
  line-height: 1.08;
}

h1 > span {
  display: block;
  text-shadow: 0 4px 0 #fff;
}

h1 small {
  display: block;
  margin-top: 10px;
  color: var(--blue);
  font-size: clamp(21px, 2.5vw, 31px);
  letter-spacing: 0.02em;
}

.welcome-copy {
  margin: 23px 0 27px;
  color: #577187;
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 700;
  line-height: 1.65;
}

.start-button {
  display: inline-flex;
  min-width: 274px;
  min-height: 88px;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 10px 27px;
  border: 4px solid #fff;
  border-radius: 28px;
  background: linear-gradient(180deg, #4d8aff, var(--blue));
  color: #fff;
  cursor: pointer;
  font-size: 27px;
  font-weight: 900;
  box-shadow: 0 9px 0 var(--blue-dark), 0 16px 28px rgba(40, 90, 174, 0.28);
  transition: transform 150ms ease, box-shadow 150ms ease;
}

.start-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 11px 0 var(--blue-dark), 0 19px 30px rgba(40, 90, 174, 0.25);
}

.start-button:active {
  transform: translateY(6px);
  box-shadow: 0 3px 0 var(--blue-dark), 0 9px 18px rgba(40, 90, 174, 0.2);
}

.play-icon {
  display: grid;
  width: 51px;
  height: 51px;
  place-items: center;
  padding-left: 4px;
  border-radius: 50%;
  background: var(--yellow);
  color: #d58a24;
  font-size: 22px;
  box-shadow: inset 0 -4px 0 rgba(214, 142, 33, 0.28);
}

.start-button small {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  letter-spacing: 0.18em;
  opacity: 0.82;
}

.start-button.compact {
  min-width: 210px;
  min-height: 70px;
  border-radius: 23px;
  font-size: 22px;
}

.session-note {
  display: flex;
  margin-top: 21px;
  align-items: center;
  gap: 8px;
  color: #6e8496;
  font-size: 14px;
  font-weight: 700;
}

.friends-stage {
  position: relative;
  min-height: 530px;
}

.rainbow {
  position: absolute;
  top: 44px;
  right: 5%;
  width: 78%;
  height: 360px;
  overflow: hidden;
  border: 25px solid #ff8e95;
  border-bottom: 0;
  border-radius: 300px 300px 0 0;
  opacity: 0.92;
}

.rainbow::before,
.rainbow::after,
.rainbow span {
  position: absolute;
  border-radius: 260px 260px 0 0;
  content: "";
}

.rainbow::before {
  inset: 0;
  border: 24px solid #ffd55f;
  border-bottom: 0;
}

.rainbow::after {
  inset: 24px;
  border: 24px solid #63cf96;
  border-bottom: 0;
}

.rainbow span {
  inset: 48px;
  height: 250px;
  border: 24px solid #6ba6f1;
  border-bottom: 0;
  background: #eaf8ff;
}

.friend {
  position: absolute;
  z-index: 3;
  display: flex;
  width: 184px;
  height: 207px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 5px solid #fff;
  border-radius: 46% 54% 48% 52% / 54% 48% 52% 46%;
  box-shadow: 0 16px 30px rgba(53, 91, 120, 0.2), inset 0 -10px 0 rgba(0, 0, 0, 0.07);
}

.friend-letter {
  color: #fff;
  font-size: 88px;
  font-weight: 900;
  line-height: 0.88;
  text-shadow: 0 5px 0 rgba(35, 68, 92, 0.2);
}

.friend-thing {
  width: 66px;
  height: 66px;
  margin-top: 8px;
  border: 3px solid rgba(255,255,255,.74);
  box-shadow: 0 4px 8px rgba(44, 79, 104, 0.16);
}

.friend-apple { top: 30px; left: 7%; transform: rotate(-7deg); background: #f06376; }
.friend-ball { top: 182px; right: 2%; transform: rotate(7deg); background: #f5b84b; }
.friend-cat { bottom: 15px; left: 28%; transform: rotate(-2deg); background: #688ee9; }

.ground {
  position: absolute;
  right: -12vw;
  bottom: -110px;
  left: -8vw;
  height: 175px;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(180deg, #9edb78, var(--green));
  box-shadow: inset 0 11px 0 rgba(255, 255, 255, 0.18);
}

.flower {
  position: absolute;
  top: 16px;
  color: #fff;
  font-size: 29px;
  text-shadow: 0 3px 0 rgba(73, 144, 61, 0.24);
}

.flower-one { left: 19%; color: #fff6a0; }
.flower-two { left: 53%; top: 38px; color: #f6b1c5; }
.flower-three { right: 12%; color: #fff; }

.sun-glow {
  position: absolute;
  top: -90px;
  left: -70px;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(255, 225, 105, 0.45);
  box-shadow: 0 0 90px rgba(255, 223, 94, 0.34);
}

.cloud {
  position: absolute;
  z-index: 1;
  width: 130px;
  height: 39px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
}

.cloud::before,
.cloud::after {
  position: absolute;
  bottom: 0;
  border-radius: 50%;
  background: inherit;
  content: "";
}

.cloud::before { left: 23px; width: 57px; height: 57px; }
.cloud::after { right: 20px; width: 45px; height: 45px; }
.cloud-one { top: 160px; left: 46%; transform: scale(0.8); }
.cloud-two { top: 95px; right: 4%; transform: scale(0.66); }

button:focus-visible {
  outline: 5px solid rgba(255, 199, 58, 0.75);
  outline-offset: 5px;
}

.soft-button,
.danger-soft-button {
  min-height: 54px;
  padding: 0 22px;
  border: 2px solid rgba(53, 111, 229, 0.18);
  border-radius: 17px;
  background: #fff;
  color: #3d6687;
  cursor: pointer;
  font-weight: 800;
  box-shadow: 0 5px 0 rgba(75, 108, 133, 0.1);
}

.danger-soft-button {
  border-color: rgba(210, 79, 87, 0.22);
  color: #bd4d55;
}

/* Game */
.game-shell {
  min-height: 100svh;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 13%, rgba(255,255,255,.82) 0 4px, transparent 5px),
    radial-gradient(circle at 83% 19%, rgba(255,255,255,.78) 0 4px, transparent 5px),
    linear-gradient(180deg, #dff5ff 0%, #f4fbff 62%, #fff7df 100%);
}

.game-header {
  display: grid;
  width: min(1040px, calc(100% - 34px));
  margin: 0 auto;
  padding: 22px 0;
  grid-template-columns: 64px 1fr 64px;
  align-items: center;
  gap: 20px;
}

.round-icon-button {
  display: grid;
  width: 60px;
  height: 60px;
  place-items: center;
  border: 4px solid #fff;
  border-radius: 21px;
  background: #6fa6e8;
  color: #fff;
  cursor: pointer;
  font-family: Arial, sans-serif;
  font-size: 31px;
  font-weight: 900;
  box-shadow: 0 6px 0 #4f82c3, 0 10px 20px rgba(58, 96, 134, .14);
}

.speaker-button {
  background: #f3b94a;
  box-shadow: 0 6px 0 #d6962e, 0 10px 20px rgba(138, 100, 31, .13);
  font-size: 26px;
}

.round-progress {
  display: flex;
  min-height: 43px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 0 22px;
  border: 3px solid rgba(255,255,255,.84);
  border-radius: 999px;
  background: rgba(255,255,255,.58);
}

.progress-dot {
  width: 18px;
  height: 18px;
  border: 3px solid #a9c8dc;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s ease, background .2s ease;
}

.progress-dot.active {
  transform: scale(1.18);
  border-color: #e1a02f;
  background: #ffd55a;
  box-shadow: 0 0 0 4px rgba(255, 213, 90, .2);
}

.question-area {
  display: flex;
  width: min(1050px, calc(100% - 40px));
  min-height: calc(100svh - 108px);
  margin: 0 auto;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 42px;
}

.learning-focus {
  display: grid;
  width: min(510px, 100%);
  place-items: center;
  gap: 12px;
  padding: 18px 28px 22px;
  border: 6px solid #fff;
  border-radius: 42px;
  background: rgba(255,253,244,.94);
  box-shadow: 0 16px 38px rgba(55, 97, 128, .18);
}

.learning-focus.number-focus {
  min-height: 370px;
}

.number-dot-board {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 13px;
}

.focus-number-dots {
  width: min(390px, 86vw);
  min-height: 310px;
  padding: 22px;
  border: 5px solid #fff;
  border-radius: 36px;
  background: linear-gradient(150deg, #fffdf5, #edf8ff);
  box-shadow: 0 10px 26px rgba(55, 83, 104, .17);
}

.number-dot-row {
  display: flex;
  min-height: 45px;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.number-dot-row i {
  display: block;
  width: clamp(32px, 5.2vw, 45px);
  height: clamp(32px, 5.2vw, 45px);
  border: 4px solid #fff;
  border-radius: 50%;
  background: #ef6475;
  box-shadow: inset 0 -5px 0 rgba(118, 37, 51, .13), 0 4px 8px rgba(76, 91, 103, .15);
}

.number-dot-row:nth-child(2n) i { background: #f4b94f; }
.number-dot-row:nth-child(3n) i { background: #69b97a; }
.number-dot-row:nth-child(4n) i { background: #5d98e2; }

.empty-dot-note {
  display: grid;
  width: 210px;
  height: 210px;
  place-items: center;
  border: 7px dashed #a8c6d9;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(168, 198, 217, .15), transparent 66%);
}

.number-word-board {
  display: grid;
  width: min(430px, 84vw);
  min-height: 270px;
  place-content: center;
  gap: 20px;
  padding: 30px;
  border: 5px solid #fff;
  border-radius: 36px;
  background: linear-gradient(150deg, #fff8df, #edf8ff);
  color: #355f83;
  text-align: center;
  box-shadow: 0 10px 26px rgba(55, 83, 104, .17);
}

.number-word-board strong {
  overflow-wrap: anywhere;
  font-size: clamp(27px, 5vw, 48px);
  line-height: 1.12;
}

.number-word-board small {
  color: #e45d70;
  font-size: clamp(29px, 5.5vw, 52px);
  font-weight: 900;
  line-height: 1.15;
}

.learning-focus.large-number-focus { min-height: 370px; }

.focus-picture {
  width: clamp(238px, 31vh, 324px);
  height: clamp(238px, 31vh, 324px);
  border: 5px solid #fff;
  border-radius: 30%;
  box-shadow: 0 10px 26px rgba(55, 83, 104, .2);
}

.focus-caption {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  color: #395d79;
}

.focus-caption strong {
  display: grid;
  width: 66px;
  height: 66px;
  place-items: center;
  border-radius: 21px;
  background: #ef6475;
  color: #fff;
  font-size: 45px;
  line-height: 1;
  text-shadow: 0 3px 0 rgba(110, 39, 55, .16);
  box-shadow: inset 0 -6px 0 rgba(112, 42, 53, .13);
}

.focus-word {
  display: flex;
  align-items: center;
  gap: 0;
}

.focus-word b {
  font-size: clamp(27px, 3.2vw, 39px);
  font-weight: 900;
}

.focus-caption small {
  color: #667f92;
  font-size: clamp(18px, 2vw, 23px);
  font-weight: 900;
}

.choice-grid {
  display: grid;
  width: min(760px, 100%);
  place-items: center;
  align-content: center;
  justify-content: center;
  gap: clamp(24px, 4vw, 46px);
  padding: 25px 0 12px;
}

.choice-grid.choices-2 { grid-template-columns: repeat(2, minmax(180px, 250px)); }
.choice-grid.choices-3 { grid-template-columns: repeat(3, minmax(150px, 205px)); }

.letter-choice {
  display: flex;
  width: 100%;
  min-height: 142px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 8px solid #fff;
  border-radius: 36px;
  background: linear-gradient(155deg, #71a8f0, #4d83d9);
  color: #fff;
  cursor: pointer;
  font-size: clamp(74px, 9vw, 108px);
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 8px 0 rgba(35, 66, 111, .2);
  box-shadow: 0 13px 0 #3768aa, 0 21px 34px rgba(43, 79, 113, .2);
  transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
  touch-action: manipulation;
  user-select: none;
}

.letter-choice > span { line-height: .88; }

.letter-choice.number-choice > span {
  font-size: clamp(65px, 8.5vw, 100px);
}

.letter-choice > small {
  margin-top: 15px;
  padding: 6px 13px;
  border-radius: 999px;
  background: rgba(255,255,255,.2);
  font-size: clamp(13px, 1.6vw, 17px);
  letter-spacing: .04em;
  text-shadow: none;
}

.letter-choice:nth-child(2) {
  background: linear-gradient(155deg, #78c982, #4caa60);
  box-shadow: 0 13px 0 #378747, 0 21px 34px rgba(46, 111, 58, .18);
}

.letter-choice:nth-child(3) {
  background: linear-gradient(155deg, #f4c85e, #e7a83d);
  box-shadow: 0 13px 0 #bd7e2d, 0 21px 34px rgba(116, 78, 35, .18);
}

.letter-choice:hover:not(:disabled) { transform: translateY(-5px) rotate(-1deg); }
.letter-choice:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 5px 0 #3768aa; }
.letter-choice:nth-child(2):active:not(:disabled) { box-shadow: 0 5px 0 #378747; }
.letter-choice:nth-child(3):active:not(:disabled) { box-shadow: 0 5px 0 #bd7e2d; }
.letter-choice:disabled { cursor: default; }
.letter-choice.wrong-choice { animation: gentle-shake .42s ease; filter: saturate(.78); }
.letter-choice.correct-choice { transform: scale(1.05); filter: brightness(1.08); }
.letter-choice.hinted { box-shadow: 0 13px 0 #3768aa, 0 0 0 10px rgba(255, 213, 90, .52), 0 21px 34px rgba(43, 79, 113, .2); }
.letter-choice.assisted { animation: helpful-glow .8s ease-in-out infinite alternate; }

.feedback-message {
  min-height: 35px;
  color: #607a90;
  font-size: 19px;
  font-weight: 900;
}

.reward-overlay {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  border: 0;
  background: rgba(223, 245, 255, .68);
  backdrop-filter: blur(6px);
  color: inherit;
  cursor: pointer;
  font: inherit;
  text-align: inherit;
}

.wrong-feedback-overlay {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 20px;
  border: 0;
  background: rgba(255, 249, 246, .16);
  color: #c94d5d;
  cursor: pointer;
  font: inherit;
}

.wrong-mark {
  display: grid;
  width: clamp(112px, 18vw, 154px);
  height: clamp(112px, 18vw, 154px);
  place-items: center;
  border: 7px solid #f19aa4;
  border-radius: 50%;
  background: rgba(255, 247, 247, .97);
  color: #df5b6b;
  font-family: Arial, sans-serif;
  font-size: clamp(88px, 14vw, 122px);
  font-weight: 700;
  line-height: .76;
  box-shadow: 0 13px 30px rgba(133, 61, 71, .16);
  text-shadow: 0 3px 0 #fff;
  animation: gentle-cross-shake .5s ease both;
}

.wrong-overlay-copy {
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,.92);
  font-size: clamp(17px, 2.3vw, 22px);
  font-weight: 900;
  box-shadow: 0 6px 18px rgba(89, 65, 70, .1);
}

.reward-card {
  position: relative;
  display: grid;
  width: min(520px, 100%);
  min-height: 380px;
  place-items: center;
  padding: 28px;
  overflow: hidden;
  border: 9px solid #ef6475;
  border-radius: 48px;
  background: #fffdf4;
  box-shadow: 0 24px 60px rgba(37, 75, 104, .24);
  animation: reward-pop .36s cubic-bezier(.2, 1.4, .5, 1);
}

.reward-card::before {
  position: absolute;
  inset: -60px;
  z-index: -1;
  background: conic-gradient(from 0deg, #fff5b6, #fff, #dff5ff, #fff, #fff5b6);
  content: "";
  animation: slow-spin 8s linear infinite;
}

.reward-stars {
  color: #f2b93e;
  font-size: 34px;
  letter-spacing: 16px;
}

.reward-picture {
  width: 148px;
  height: 148px;
  border: 5px solid #fff;
  box-shadow: 0 9px 18px rgba(56, 79, 93, .18);
}

.reward-number-dots {
  width: 250px;
  min-height: 150px;
  gap: 6px;
}

.reward-number-dots .number-dot-row {
  min-height: 24px;
  gap: 8px;
}

.reward-number-dots .number-dot-row i {
  width: 23px;
  height: 23px;
  border-width: 2px;
  box-shadow: inset 0 -3px 0 rgba(118, 37, 51, .13), 0 2px 4px rgba(76, 91, 103, .13);
}

.reward-number-dots .empty-dot-note {
  width: 125px;
  height: 125px;
  border-width: 5px;
  font-size: 20px;
}

.reward-number-words {
  width: min(340px, 76vw);
  min-height: 130px;
  gap: 9px;
  padding: 16px 22px;
  border-width: 4px;
  border-radius: 25px;
}

.reward-number-words strong { font-size: clamp(20px, 4vw, 30px); }
.reward-number-words small { font-size: clamp(22px, 4.2vw, 34px); }

.reward-word {
